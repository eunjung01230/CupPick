name: Feature
description: 새로운 기능 또는 사용자 가치 추가
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 / 목적
      description: 무엇을 해결하려는지 작성해주세요.
      placeholder: 사용자가 ... 할 수 없어 ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 이번 Issue에서 반드시 포함할 범위
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 완료 여부를 객관적으로 판단할 수 있게 작성해주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위
      description: 이번 Issue에서 하지 않을 것
      placeholder: |
        - ...
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 참고
      description: 화면, API, 디자인, 문서 링크 등
    validations:
      required: false
