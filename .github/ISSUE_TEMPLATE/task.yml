name: Task / Chore
description: 리팩터링, 설정, 문서, 테스트, 유지보수 작업
title: "[Task] "
labels: ["chore"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 작업 항목
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] ...
    validations:
      required: true
